name: 🛠️ Fix an entry
description: Report a wrong link, venue, category, or duplicate
title: "[Fix] "
labels: ["fix-entry"]
body:
  - type: input
    id: title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should be changed?
      placeholder: "e.g. venue arXiv 2025 -> ICLR 2026"
    validations:
      required: true
